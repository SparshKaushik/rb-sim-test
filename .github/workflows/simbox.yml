name: simbox
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios, android]
        default: ios
jobs:
  simbox:
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dc4bfc750105b1c2e15108443d1ca4d8e7ecfbae
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify source and runner capability
        env:
          DEVICE_PLATFORM: ${{ inputs.platform }}
        run: |
          echo 'ba2d7dae0e06a68b31b762179dcf296ecf63f06c6e716a4c3fdc6eac274bf167  .simbox-verification/agent.mjs' | shasum -a 256 -c -
          uname -sm
          if [ "$DEVICE_PLATFORM" = android ]; then
            test -e /dev/kvm
            sudo chmod 666 /dev/kvm
          else
            xcrun --find simctl
          fi
      - name: Unreleased Simbox preview verification agent
        env:
          SIMBOX_TOKEN: ${{ secrets.SIMBOX_TOKEN }}
          SIMBOX_API_URL: https://api.simbox.touchtech.club
        run: bun .simbox-verification/agent.mjs
