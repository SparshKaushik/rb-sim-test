name: simbox
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios, android]
        default: ios
jobs:
  simbox:
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 53ec13f2b20d6249a6b6accc84fe97fd613f1ff0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify source and runner capability
        env:
          DEVICE_PLATFORM: ${{ inputs.platform }}
        run: |
          echo '2df2c0592a12cdf8bb7396310dfff67e88f261060255df52a2edcfcd7ed8a691  .simbox-verification/agent.mjs' | shasum -a 256 -c -
          uname -sm
          if [ "$DEVICE_PLATFORM" = android ]; then
            test -e /dev/kvm
            sudo chmod 666 /dev/kvm
          else
            xcrun --find simctl
          fi
      - name: Unreleased Simbox preview verification agent
        env:
          SIMBOX_TOKEN: ${{ secrets.SIMBOX_TOKEN }}
          SIMBOX_API_URL: https://api.simbox.touchtech.club
        run: bun .simbox-verification/agent.mjs
