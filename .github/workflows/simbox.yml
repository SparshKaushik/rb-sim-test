name: simbox
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios, android]
        default: ios
jobs:
  simbox:
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 787b3bafe6e7092b46f2f04eefae27003f25a753
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify source and runner capability
        env:
          DEVICE_PLATFORM: ${{ inputs.platform }}
        run: |
          echo '1f53747f2cece85adca63e3fd0d6244bd34c82071882a9ee4171e9dce5922679  .simbox-verification/agent.mjs' | shasum -a 256 -c -
          uname -sm
          if [ "$DEVICE_PLATFORM" = android ]; then
            test -e /dev/kvm
            sudo chmod 666 /dev/kvm
          else
            xcrun --find simctl
          fi
      - name: Unreleased Simbox preview verification agent
        env:
          SIMBOX_TOKEN: ${{ secrets.SIMBOX_TOKEN }}
          SIMBOX_API_URL: https://api.simbox.touchtech.club
        run: bun .simbox-verification/agent.mjs
