name: runnerbox

on:
  workflow_dispatch:

jobs:
  runnerbox:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - name: Probe for foldable device types
        run: |
          {
            echo "=== ALL devicetypes ==="
            xcrun simctl list devicetypes
            echo "=== runtimes ==="
            xcrun simctl list runtimes
            echo "=== runtime availability (downloadable) ==="
            xcrun simctl runtime list 2>&1 || true
            xcodebuild -version
            ls /Library/Developer/CoreSimulator/Profiles/Runtimes/ 2>/dev/null || true
          } | tee probe.txt
          cat probe.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt
          retention-days: 1

      - name: RunnerBox agent
        uses: TouchTechClub/runner@v1
        with:
          token: ${{ secrets.RUNNERBOX_TOKEN }}
